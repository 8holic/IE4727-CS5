    <div id="rightcolumn">
        <h2>Jobs at JavaJam</h2>

        <div class="content">
            <p>Want to work at JavaJam? Fill out the form below to start your application. Required fields are marked with an asterisk *.</p>

            <form id="jobForm" method="post" action="Assets/show_post.php">
                <p>
                    <label for="myName">*Name:</label>
                    <input type="text" name="myName" id="myName">
                </p>

                <p>
                    <label for="myEmail">*E-mail:</label>
                    <input type="text" name="myEmail" id="myEmail">
                </p>

                <p>
                    <label for="startDate">Start Date:</label>
                    <input type="date" name="startDate" id="startDate">
                </p>

                <p>
                    <label for="myExperience" style="vertical-align: top;">*Experience:</label>
                    <textarea name="myExperience" id="myExperience" rows="4" cols="40"></textarea>
                </p>

                <p>
                    <br>
                    <input type="reset" value="Clear"><br>
                    <input type="submit" value="Apply Now">
                </p>
            </form>
        </div>
